name: Data Pipeline

on:
  schedule:
    # Source cadence: IP Australia rebuilds IP RAPID WEEKLY. Monthly is the
    # fastest cron this fleet allows, and it is entirely adequate here — filing
    # volumes move on a yearly timescale and the trailing years are provisional
    # regardless, because foreign applicants arrive through the PCT national
    # phase up to 30 months after their priority date.
    # Staggered to the 9th at 17:23 UTC so this repo does not fire with the rest.
    - cron: '23 17 9 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**']

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # The archive is 1.33 GB compressed / 9.51 GB expanded. Nothing is written
    # to disk — members are range-fetched and inflated in a stream — but the
    # applicant index does need headroom, hence the raised heap below.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect and aggregate
        run: node --max-old-space-size=8192 pipeline/collect.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || (git pull --rebase && git push)
